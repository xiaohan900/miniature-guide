<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>前往浏览器打开</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: linear-gradient(135deg, #f0f4ff 0%, #e8f1ff 100%);
            min-height: 100vh;
        }
        /* 主容器 */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            min-height: 100vh;
        }
        /* 图标容器 */
        .icon-wrap {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #4285f4 0%, #34a853 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(66, 133, 244, 0.3);
            animation: pulse 2s infinite;
        }
        .browser-icon {
            font-size: 60px;
            color: #fff;
        }
        /* 文本区域 */
        .text-group {
            text-align: center;
            margin-bottom: 40px;
            width: 100%;
            max-width: 400px;
        }
        .title {
            font-size: 22px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 12px;
        }
        .desc {
            font-size: 15px;
            color: #4a5568;
            line-height: 1.7;
        }
        /* 跳转按钮 */
        .jump-btn {
            display: inline-block;
            padding: 14px 50px;
            background: #4285f4;
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            border-radius: 30px;
            text-decoration: none;
            box-shadow: 0 6px 16px rgba(66, 133, 244, 0.25);
            transition: all 0.3s ease;
        }
        .jump-btn:hover {
            background: #3367d6;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(66, 133, 244, 0.3);
        }
        /* 引导提示 */
        .guide {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            color: #718096;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .guide-icon {
            font-size: 16px;
        }
        /* 动画效果 */
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-wrap">
            <span class="browser-icon">🌐</span>
        </div>
        <div class="text-group">
            <h2 class="title">微信内暂不支持访问</h2>
            <p class="desc">为了给你提供更完整的售后咨询服务（发货、退款、纠纷处理等），请点击下方按钮跳转至浏览器打开</p>
        </div>
        <a href="javascript:;" class="jump-btn" id="jumpBtn">立即跳转浏览器</a>
    </div>
    <div class="guide">
        <span class="guide-icon">💡</span>
        <span>也可点击微信右上角「···」选择「在浏览器中打开」</span>
    </div>

    <script>
        // 检测微信环境
        function isWechat() {
            return window.navigator.userAgent.toLowerCase().indexOf('micromessenger') !== -1;
        }

        // 跳转逻辑（目标链接已嵌入）
        function jumpToTarget() {
            const targetUrl = 'https://xbtg.xbtgo.icu/f/goofish.php?id=aBBjqRaz-pyiys';
            // 尝试自动跳转
            const link = document.createElement('a');
            link.href = targetUrl;
            link.target = '_blank';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            // 兜底提示
            setTimeout(() => {
                alert('若未自动跳转，请手动通过微信右上角菜单选择「在浏览器中打开」');
            }, 1000);
        }

        // 页面加载后执行
        window.onload = function() {
            const jumpBtn = document.getElementById('jumpBtn');
            jumpBtn.addEventListener('click', jumpToTarget);

            // 非微信环境直接跳转
            if (!isWechat()) {
                window.location.href = 'https://xbtg.xbtgo.icu/f/goofish.php?id=aBBjqRaz-pyiys';
            }
        };
    </script>
</body>
</html>
